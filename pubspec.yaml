name: edumanage
description: "EduManage - School Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  drift: ^2.27.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.1
  pdf: ^3.11.0
  printing: ^5.13.0
  barcode: ^2.2.8
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  image_picker: ^1.1.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.27.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
